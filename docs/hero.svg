<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Seedance Reference Sheets: same face, every shot</title>
  <desc id="desc">Set a character up with sliders, copy the prompt, and get a clean reference sheet from GPT Image 2.5 or Seedream 5.0. One HTML file, no install, no account, no API key. On the right, the app's head sheet card with its Copy for Seedream 5.0 button and the start of its prompt.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #111111; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #374151; }
    .muted { fill: #4B5563; }
    .white { fill: #FFFFFF; }
    .accent { fill: #F04E0A; }
  </style>
  <rect width="1200" height="520" rx="32" fill="#E7E8EC"/>

  <rect x="64" y="60" width="318" height="40" rx="20" fill="#111111"/>
  <text x="84" y="86" font-size="17" font-weight="600" class="white">Reference sheets for Seedance 2.5</text>

  <text x="58" y="206" font-size="92" font-weight="800" letter-spacing="-3">Same face.</text>
  <text x="58" y="304" font-size="92" font-weight="800" letter-spacing="-3" class="accent">Every shot.</text>

  <text x="64" y="362" font-size="22" class="muted">Set a character up with sliders. Copy the prompt.</text>
  <text x="64" y="394" font-size="22" class="muted">Get a clean sheet from GPT Image 2.5 or Seedream 5.0.</text>

  <g font-size="16" font-weight="600">
    <rect x="64" y="428" width="112" height="36" rx="18" fill="#FFFFFF"/>
    <text x="82" y="452">1 HTML file</text>
    <rect x="186" y="428" width="104" height="36" rx="18" fill="#FFFFFF"/>
    <text x="204" y="452">No install</text>
    <rect x="300" y="428" width="118" height="36" rx="18" fill="#FFFFFF"/>
    <text x="318" y="452">No account</text>
    <rect x="428" y="428" width="122" height="36" rx="18" fill="#FFFFFF"/>
    <text x="446" y="452">No API key</text>
  </g>

  <rect x="700" y="60" width="440" height="400" rx="28" fill="#FFFFFF"/>
  <circle cx="742" cy="108" r="18" fill="#111111"/>
  <text x="736" y="114" font-size="17" font-weight="700" class="white">1</text>
  <text x="774" y="116" font-size="24" font-weight="700">Head sheet</text>

  <rect x="724" y="146" width="392" height="62" rx="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="742" y="172" font-size="15" class="muted">Add in Seedream</text>
  <text x="742" y="196" font-size="18" font-weight="600">No image</text>

  <rect x="724" y="224" width="392" height="52" rx="26" fill="#F04E0A"/>
  <text x="920" y="257" font-size="19" font-weight="700" text-anchor="middle" class="white">Copy for Seedream 5.0</text>

  <rect x="724" y="294" width="392" height="142" rx="14" fill="#F3F4F6"/>
  <g font-size="15" class="mono">
    <text x="740" y="320" class="mono">Standardized clinical photograph from</text>
    <text x="740" y="341" class="mono">a general dermatology patient record,</text>
    <text x="740" y="362" class="mono">16:9 landscape, four equal vertical</text>
    <text x="740" y="383" class="mono">panels separated by thin mid-grey</text>
    <text x="740" y="404" class="mono">gaps: the same everyday woman in all</text>
    <text x="740" y="425" class="mono">four panels, photographed as she is.</text>
  </g>
</svg>
