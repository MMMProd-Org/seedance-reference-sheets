<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Before and after</title>
  <desc id="desc">With a prompt alone, five shots give five different women: brown bob and round face, then blonde with a sharper jaw, then ten years older, then a new fringe, then someone else. With reference sheets, the same woman in all five shots.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #111111; }
    .muted { fill: #6B7280; }
    .accent { fill: #F04E0A; }
  </style>
  <rect width="1200" height="440" rx="32" fill="#E7E8EC"/>

  <rect x="40" y="40" width="548" height="360" rx="28" fill="#FFFFFF"/>
  <text x="76" y="94" font-size="28" font-weight="800">A prompt alone</text>
  <text x="76" y="124" font-size="17" class="muted">The same text, five shots</text>
  <g font-size="20">
    <circle cx="86" cy="171" r="9" fill="#8B5E3C"/>
    <text x="108" y="178" font-weight="700">Shot 1</text><text x="200" y="178">brown bob, round face</text>
    <circle cx="86" cy="217" r="9" fill="#E3B341"/>
    <text x="108" y="224" font-weight="700">Shot 2</text><text x="200" y="224">blonde now, sharper jaw</text>
    <circle cx="86" cy="263" r="9" fill="#9CA3AF"/>
    <text x="108" y="270" font-weight="700">Shot 3</text><text x="200" y="270">ten years older</text>
    <circle cx="86" cy="309" r="9" fill="#7C5CC4"/>
    <text x="108" y="316" font-weight="700">Shot 4</text><text x="200" y="316">a fringe appeared</text>
    <circle cx="86" cy="355" r="9" fill="#3B82F6"/>
    <text x="108" y="362" font-weight="700">Shot 5</text><text x="200" y="362" font-style="italic">who is this?</text>
  </g>

  <rect x="612" y="40" width="548" height="360" rx="28" fill="#FFFFFF"/>
  <text x="648" y="94" font-size="28" font-weight="800">With reference sheets</text>
  <text x="648" y="124" font-size="17" class="muted">A head sheet and a body sheet, five shots</text>
  <g font-size="20">
    <circle cx="658" cy="171" r="9" fill="#F04E0A"/>
    <text x="680" y="178" font-weight="700">Shot 1</text><text x="772" y="178">her</text>
    <circle cx="658" cy="217" r="9" fill="#F04E0A"/>
    <text x="680" y="224" font-weight="700">Shot 2</text><text x="772" y="224">her</text>
    <circle cx="658" cy="263" r="9" fill="#F04E0A"/>
    <text x="680" y="270" font-weight="700">Shot 3</text><text x="772" y="270">her</text>
    <circle cx="658" cy="309" r="9" fill="#F04E0A"/>
    <text x="680" y="316" font-weight="700">Shot 4</text><text x="772" y="316">her</text>
    <circle cx="658" cy="355" r="9" fill="#F04E0A"/>
    <text x="680" y="362" font-weight="700">Shot 5</text><text x="772" y="362" font-weight="700" class="accent">still her</text>
  </g>
</svg>
