name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the older run, so a
# slower build of an older commit can never deploy over a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Ubuntu 26.04, not ubuntu-latest: `playwright install --with-deps` installs Ubuntu packages,
    # so moving to a new Ubuntu release happens only on purpose, with a green run. GitHub still
    # updates the 26.04 image weekly, as it did under ubuntu-latest.
    runs-on: ubuntu-26.04
    # Usually about 1 minute; installing the test dependencies once took 13.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the page
        run: python build_i18n.py && python patch_new.py

      - name: Install test dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Smoke test
        run: python tests/smoke.py

      - name: Golden prompts
        run: python tests/golden_prompts.py

      - name: Prepare site
        if: github.event_name == 'push'
        run: mkdir -p _site && cp new/merged.html _site/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
